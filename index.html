<script>

const KEY='minha_empresa_v1';
const initial={settings:{name:'Minha Empresa',nif:'04884i4677',address:'Luena, Moxico',currency:'Kz',pin:'1234',accessMode:'none',recoveryCode:'MG-RECUPERAR-2026',theme:'azul',accent:'#1676c5',fontSize:'15',autoLock:0,showMetrics:['Vendas realizadas','Lucro estimado','Despesas registadas','Dívidas por receber','Produtos cadastrados','Clientes','Vendas registadas','Stock total'],operatorName:'Operador',chartType:'bar',salesChartType:'bar',financeChartType:'bar',salesChartVisible:true,financeChartSeries:['profit','debt','expenses','cogs','received']},products:[],clients:[],sales:[],expenses:[],stockMoves:[],payments:[],debts:[],users:[]};
function normalize(x){const d={...initial,...(x||{})};d.settings={...initial.settings,...(x?.settings||{})};if(!['none','pin','user'].includes(d.settings.accessMode))d.settings.accessMode='none';if(!Array.isArray(d.settings.showMetrics))d.settings.showMetrics=initial.settings.showMetrics.slice();for(const k of ['products','clients','sales','expenses','stockMoves','payments','debts','returns','users'])if(!Array.isArray(d[k]))d[k]=[];d.sales=d.sales.map(s=>({...s,discount:s.discount||0,subtotal:s.subtotal??s.total??0,paid:s.paid??s.total??0,due:s.due??0,paymentMethod:s.paymentMethod||'Dinheiro',payments:Array.isArray(s.payments)?s.payments:[],items:(s.items||[]).map(i=>({...i,discount:i.discount||0,lineTotal:i.lineTotal??i.qty*i.price}))}));return d}
function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return normalize(initial)}}let db=load(),page='Início',saleCart=[],currentUser=null,selectedSaleProductId=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return Number(n||0).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+db.settings.currency}function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}function val(k){return document.getElementById(k)?.value?.trim()||''}function num(k){return Number(val(k)||0)}function sum(a,f){return a.reduce((n,x)=>n+f(x),0)}
function showSecurityGate(){const mode=db.settings.accessMode||'none';if(mode==='none'){document.getElementById('authGate').classList.add('hide');document.getElementById('app').classList.remove('hide');return}const gate=document.getElementById('authGate');gate.innerHTML=`<section class="auth-card"><div class="auth-mark">MG</div><div class="auth-kicker">ACESSO PROTEGIDO</div><h1>Meu Gestor</h1><p class="muted">Organize. Controle. Cresça.</p>${mode==='pin'?`<label>PIN de segurança</label><input id="authPin" type="password" inputmode="numeric" placeholder="Introduza o PIN" onkeydown="if(event.key==='Enter')authenticate()">`:`<label>Nome de utilizador</label><input id="authUsername" autocomplete="username" placeholder="Nome de utilizador"><label>Palavra-passe</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="Palavra-passe" onkeydown="if(event.key==='Enter')authenticate()">`}<p id="authError" class="auth-error"></p><button class="auth-submit" onclick="authenticate()">Entrar no sistema</button>${mode==='user'?`<button class="secondary auth-submit" onclick="showRecoveryForm()">Recuperar acesso / palavra-passe</button>`:''}<p class="auth-foot">Acesso local • Funcionamento offline</p></section>`;gate.classList.remove('hide');document.getElementById('app').classList.add('hide');setTimeout(()=>document.getElementById(mode==='pin'?'authPin':'authUsername')?.focus(),80)}
function showRecoveryForm(){const gate=document.getElementById('authGate');gate.innerHTML=`<section class="auth-card"><div class="auth-mark">MG</div><div class="auth-kicker">RECUPERAÇÃO SEGURA</div><h1>Recuperar acesso</h1><p class="muted">Confirme a sua conta com o código de recuperação e crie uma nova palavra-passe.</p><label>Nome de utilizador</label><input id="recoverUsername" autocomplete="username" placeholder="Nome de utilizador"><label>Código de recuperação</label><input id="recoverCode" type="password" autocomplete="off" placeholder="Código de recuperação"><label>Nova palavra-passe</label><input id="recoverPassword" type="password" autocomplete="new-password" placeholder="Mínimo de 4 caracteres"><label>Confirmar nova palavra-passe</label><input id="recoverConfirm" type="password" autocomplete="new-password" placeholder="Repita a nova palavra-passe" onkeydown="if(event.key==='Enter')resetUserPassword()"><p id="recoverError" class="auth-error"></p><button class="auth-submit" onclick="resetUserPassword()">Redefinir palavra-passe</button><button class="secondary auth-submit" onclick="showSecurityGate()">Voltar ao login</button><p class="auth-foot">A recuperação funciona offline e não apaga os dados comerciais.</p></section>`;document.getElementById('recoverUsername')?.focus()}
function resetUserPassword(){const username=val('recoverUsername'),code=val('recoverCode').replace(/\s+/g,'').toUpperCase(),password=document.getElementById('recoverPassword')?.value||'',confirm=document.getElementById('recoverConfirm')?.value||'',u=db.users.find(x=>String(x.username||'').toLowerCase()===username.toLowerCase()),err=document.getElementById('recoverError');if(!u){err.textContent='Nome de utilizador não encontrado.';return}if(code!==String(db.settings.recoveryCode||'MG-RECUPERAR-2026').replace(/\s+/g,'').toUpperCase()){err.textContent='Código de recuperação incorrecto.';return}if(password.length<4){err.textContent='A nova palavra-passe deve ter pelo menos 4 caracteres.';return}if(password!==confirm){err.textContent='As palavras-passe não coincidem.';return}u.password=password;save();showSecurityGate();const e=document.getElementById('authError');if(e)e.textContent='Palavra-passe redefinida. Já pode entrar com a nova palavra-passe.';}
function changeRecoveryCode(){const old=val('oldRecoveryCode').replace(/\s+/g,'').toUpperCase(),next=val('newRecoveryCode').replace(/\s+/g,'').toUpperCase(),confirm=val('confirmRecoveryCode').replace(/\s+/g,'').toUpperCase();if(old!==String(db.settings.recoveryCode||'MG-RECUPERAR-2026').replace(/\s+/g,'').toUpperCase())return alert('Código actual incorrecto.');if(next.length<8)return alert('O novo código deve ter pelo menos 8 caracteres.');if(next!==confirm)return alert('A confirmação do novo código não coincide.');db.settings.recoveryCode=next;save();render();alert('Código de recuperação actualizado. Guarde-o num local seguro.')}function authenticate(){const mode=db.settings.accessMode||'none';if(mode==='none'){currentUser=null}else if(mode==='pin'){if(val('authPin')!==String(db.settings.pin||'')){document.getElementById('authError').textContent='PIN incorrecto. Tente novamente.';return}currentUser=null}else{const username=val('authUsername'),password=document.getElementById('authPassword')?.value||'',u=db.users.find(x=>String(x.username||'').toLowerCase()===username.toLowerCase()&&x.password===password);if(!u){document.getElementById('authError').textContent='Utilizador ou palavra-passe incorrectos.';return}currentUser={name:u.name,username:u.username,role:u.role||'Operador'}}document.getElementById('authGate').classList.add('hide');document.getElementById('app').classList.remove('hide');render();resetIdleTimer()}function lockApp(){if((db.settings.accessMode||'none')==='none'){alert('A segurança está configurada como Nenhum. Active PIN ou Utilizador nas Configurações para bloquear o acesso.');return}currentUser=null;clearTimeout(idleTimer);showSecurityGate()}function logout(){lockApp()}function operatorName(){return currentUser?.name||db.settings.operatorName||'Operador'}
const pages=['Início','Produtos','Clientes','Vendas','Dívidas','Devoluções','Despesas','Facturas','Relatórios','Diagnóstico','Configurações'];function nav(){document.getElementById('tabs').innerHTML=pages.map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join('')}function go(p){page=p;render()}function render(){document.body.dataset.theme=db.settings.theme||'azul';document.documentElement.style.setProperty('--accent',db.settings.accent||'#1676c5');document.documentElement.style.setProperty('--app-font',(db.settings.fontSize||15)+'px');nav();document.getElementById('brand').textContent='Meu Gestor';document.getElementById('subbrand').textContent=db.settings.name+' • '+db.settings.address+' • '+db.settings.currency;const foot=document.querySelector('.foot');if(foot)foot.textContent='© '+new Date().getFullYear()+' • Meu Gestor • Versão 8.2.2 • Criado por Dom$alva • Aplicação offline';const lockBtn=document.getElementById('lockButton');if(lockBtn)lockBtn.classList.toggle('hide',(db.settings.accessMode||'none')==='none');document.getElementById('view').innerHTML=({'Início':home,'Produtos':products,'Clientes':clients,'Vendas':sales,'Dívidas':debtsPage,'Devoluções':returnsPage,'Despesas':expenses,'Facturas':invoices,'Relatórios':reports,'Diagnóstico':financialDiagnosis,'Configurações':settings})[page]();if(page==='Relatórios')drawReportChart()}
function activeSales(){return db.sales.filter(s=>s.status!=='anulada')}function nowTime(){return new Date().toLocaleTimeString('pt-AO',{hour:'2-digit',minute:'2-digit',hour12:false})}function outstanding(){return sum(activeSales(),s=>Math.max(0,Number(s.due)||0))}function revenue(){return Math.max(0,sum(activeSales(),s=>Number(s.total)||0))}function expensesTotal(){return sum(db.expenses,e=>Number(e.amount)||0)}function costTotal(){return sum(activeSales(),s=>sum(s.items||[],i=>(Number(i.qty)||0)*(Number(i.cost)||0)))}
function productStats(pid){let qty=0,amount=0;activeSales().forEach(s=>{const items=s.items||[],base=sum(items,i=>Number(i.lineTotal??(Number(i.qty)*Number(i.price)))||0),factor=base>0?Math.max(0,Number(s.total)||0)/base:0;items.forEach(i=>{if(i.productId===pid){qty+=Number(i.qty)||0;amount+=(Number(i.lineTotal??(Number(i.qty)*Number(i.price)))||0)*factor}})});return {qty,amount}}
function productStatsAll(){return db.products.map(p=>({product:p,...productStats(p.id)})).sort((a,b)=>b.amount-a.amount)}
function riskOverview(){const rev=revenue(),cost=costTotal(),exp=expensesTotal(),profit=rev-cost-exp,received=sum(activeSales(),x=>Number(x.paid)||0),cash=received-exp,due=outstanding(),stockCost=sum(db.products,p=>(Number(p.stock)||0)*(Number(p.cost)||0));let score=0,reasons=[];if(profit<0){score+=30;reasons.push('resultado estimado negativo')}if(cash<0){score+=25;reasons.push('recebimentos abaixo das despesas')}if(rev>0&&due>rev*.5){score+=15;reasons.push('muitas dívidas por receber')}if(rev>0&&profit>=0&&profit/rev<.1){score+=15;reasons.push('margem de lucro reduzida')}if(rev>0&&exp>Math.max(0,rev-cost)){score+=15;reasons.push('despesas elevadas')}if(rev===0&&stockCost>0){score+=15;reasons.push('stock sem vendas registadas')}score=Math.min(100,score);const level=score>=50?'Risco financeiro elevado':score>=25?'Atenção: risco moderado':'Sem sinais fortes de risco';const cls=score>=50?'risk-high':score>=25?'risk-medium':'risk-good';return `<section class="panel ${cls}"><h3>🔎 Alerta financeiro automático</h3><b>${level} — ${score}/100</b><p class="muted">${reasons.length?'Factores: '+esc(reasons.join('; ')):'Continue a acompanhar receitas, despesas, stock e cobranças.'}</p><button class="smallbtn secondary" onclick="go('Diagnóstico')">Abrir diagnóstico completo</button></section>`}
function home(){const rev=revenue(),exp=expensesTotal(),cost=costTotal(),due=outstanding();const all=[['Vendas realizadas',money(rev),'sales-metric','value-sales'],['Lucro estimado',money(rev-cost-exp),'profit-metric','value-info'],['Despesas registadas',money(exp),'expense-metric','value-negative'],['Dívidas por receber',money(due),'debt-metric','value-warning'],['Produtos cadastrados',db.products.length,'','value-neutral'],['Clientes',db.clients.length,'','value-info'],['Vendas registadas',activeSales().length,'','value-sales'],['Stock total',sum(db.products,p=>Number(p.stock)||0),'stock-metric','value-stock']];const shown=db.settings.showMetrics||all.map(x=>x[0]);const top=productStatsAll().slice(0,5);return `<h2>Painel de controlo</h2><div class="grid">${all.filter(x=>shown.includes(x[0])).map(x=>`<div class="metric ${x[2]}">${x[0]}<b class="${x[3]}">${x[1]}</b></div>`).join('')}</div>${riskOverview()}<section class="panel"><h3>Desempenho dos produtos mais vendidos</h3><div class="tablewrap"><table><tr><th>Produto</th><th>Unidades vendidas</th><th>Valor vendido</th></tr>${top.map(x=>`<tr><td>${esc(x.product.name)}</td><td><b class="value-info">${x.qty} ${esc(x.product.unit||'un.')}</b></td><td><b class="value-sales">${money(x.amount)}</b></td></tr>`).join('')||'<tr><td colspan="3" class="empty">Ainda não existem vendas por produto.</td></tr>'}</table></div></section><section class="panel"><h3>Alertas de stock baixo</h3>${db.products.filter(p=>Number(p.stock)<=Number(p.min)).map(p=>`<p>${esc(p.name)} — <b class="warning">${p.stock} ${esc(p.unit)}</b></p>`).join('')||'<p class="muted">Nenhum produto abaixo do mínimo.</p>'}</section><section class="panel"><h3>Últimas vendas</h3>${activeSales().slice(-5).reverse().map(s=>`<p>${s.date} ${s.time||''} • ${esc(s.clientName)} • <b class="value-sales">${money(s.total)}</b> • ${s.due>0?'<span class="bad">Em dívida: '+money(s.due)+'</span>':'<span class="pill">Liquidada</span>'}</p>`).join('')||'<p class="muted">Ainda não existem vendas.</p>'}</section>`}
function products(){const stats=productStatsAll();return `<h2>Produtos e stock</h2><section class="panel"><h3>Novo produto</h3><div class="row"><div><label>Nome</label><input id="pname"></div><div><label>Código</label><input id="pcode"></div><div><label>Preço de venda (Kz)</label><input id="pprice" type="number" min="0"></div><div><label>Custo unitário (Kz)</label><input id="pcost" type="number" min="0"></div><div><label>Quantidade inicial</label><input id="pstock" type="number" min="0" value="0"></div><div><label>Stock mínimo</label><input id="pmin" type="number" min="0" value="5"></div></div><label>Unidade</label><select id="punit"><option>un.</option><option>kg</option><option>litro</option><option>caixa</option><option>pacote</option></select><div class="actions"><button onclick="addProduct()">Guardar produto</button></div></section><section class="panel"><h3>Resumo de vendas por produto</h3><div class="legend"><span><i style="background:#16845b"></i> Valor vendido</span><span><i style="background:#176bba"></i> Quantidade vendida</span><span><i style="background:#b66a00"></i> Stock baixo</span></div><div class="tablewrap"><table><tr><th>Produto</th><th>Preço</th><th>Stock actual</th><th>Quantidade vendida</th><th>Total vendido</th><th>Acção</th></tr>${stats.map(x=>{const p=x.product;return `<tr><td>${esc(p.name)}<br><small>${esc(p.code)}</small></td><td><b class="value-info">${money(p.price)}</b></td><td><b class="${p.stock<=p.min?'value-warning':'value-stock'}">${p.stock} ${esc(p.unit)} ${p.stock<=p.min?'• Baixo':''}</b></td><td><b class="value-info">${x.qty} ${esc(p.unit||'un.')}</b></td><td><b class="value-sales">${money(x.amount)}</b></td><td><button class="smallbtn secondary" onclick="editProductPrice('${p.id}')">Editar preço</button> <button class="smallbtn secondary" onclick="adjustStock('${p.id}')">Stock</button> <button class="smallbtn danger" onclick="del('products','${p.id}')">Apagar</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Sem produtos.</td></tr>'}</table></div></section>`}
const mgNativeAlert=window.alert.bind(window);function mgDialog(message,kind='alert',defaultValue=''){return new Promise(resolve=>{const root=document.getElementById('mgDialogRoot');if(!root){if(kind==='confirm')return resolve(window.confirm(message));if(kind==='prompt')return resolve(window.prompt(message,defaultValue));mgNativeAlert(message);return resolve(null)}const isInput=kind==='prompt',isConfirm=kind==='confirm';root.innerHTML=`<div class="mg-dialog-backdrop" role="presentation"><section class="mg-dialog-card" role="dialog" aria-modal="true" aria-labelledby="mgDialogTitle"><div class="mg-dialog-head"><div class="mg-dialog-logo">MG</div><div><div class="mg-dialog-title" id="mgDialogTitle">Meu Gestor</div><div class="mg-dialog-sub">${isConfirm?'Confirmação necessária':isInput?'Introduzir informação':'Mensagem do sistema'}</div></div><div class="mg-dialog-symbol">${isConfirm?'?':isInput?'✎':'✓'}</div></div><div class="mg-dialog-message">${esc(message)}</div>${isInput?`<input id="mgDialogInput" type="text" value="${esc(defaultValue)}" autocomplete="off">`:''}<div class="mg-dialog-actions">${(isConfirm||isInput)?'<button type="button" class="secondary" id="mgDialogCancel">Cancelar</button>':''}<button type="button" id="mgDialogOk">${isConfirm?'Confirmar':isInput?'Continuar':'Entendi'}</button></div></section></div>`;const finish=value=>{root.innerHTML='';resolve(value)};root.querySelector('#mgDialogOk').onclick=()=>finish(isInput?root.querySelector('#mgDialogInput').value:isConfirm?true:null);const cancel=root.querySelector('#mgDialogCancel');if(cancel)cancel.onclick=()=>finish(isInput?null:false);const input=root.querySelector('#mgDialogInput');if(input){input.focus();input.select();input.onkeydown=e=>{if(e.key==='Enter')root.querySelector('#mgDialogOk').click();if(e.key==='Escape'&&cancel)cancel.click()}}else root.querySelector('#mgDialogOk').focus();});}
function mgAlert(message){mgDialog(String(message),'alert');}
function mgConfirm(message){return mgDialog(String(message),'confirm');}
function mgPrompt(message,value=''){return mgDialog(String(message),'prompt',String(value));}
function addProduct(){const name=val('pname'),price=num('pprice'),cost=num('pcost'),stock=num('pstock'),min=num('pmin');if(!name||price<=0||cost<0||stock<0||min<0)return alert('Verifique os dados do produto.');db.products.push({id:id(),name,code:val('pcode')||'PRD-'+Date.now().toString().slice(-6),price,cost,stock,min,unit:val('punit')});save();render()}async function editProductPrice(pid){const p=db.products.find(x=>x.id===pid);if(!p)return;const v=await mgPrompt('Novo preço de venda para '+p.name+':',String(p.price));if(v===null)return;const n=Number(String(v).replace(',','.'));if(!Number.isFinite(n)||n<=0)return alert('Introduza um preço válido, maior que zero.');p.price=n;save();render();alert('Preço actualizado. As vendas antigas mantêm o preço registado na data da venda.')}
function clients(){return `<h2>Clientes</h2><section class="panel"><h3>Novo cliente</h3><div class="row"><div><label>Nome</label><input id="cname"></div><div><label>Telefone</label><input id="cphone" inputmode="tel"></div></div><label>NIF (opcional)</label><input id="cnif"><div class="actions"><button onclick="addClient()">Guardar cliente</button></div></section><section class="panel"><table><tr><th>Nome</th><th>Telefone</th><th>NIF</th><th></th></tr>${db.clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.nif)}</td><td><button class="smallbtn danger" onclick="del('clients','${c.id}')">Apagar</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Sem clientes.</td></tr>'}</table></section>`}function addClient(){const name=val('cname');if(!name)return alert('Informe o nome.');db.clients.push({id:id(),name,phone:val('cphone'),nif:val('cnif')});save();render()}
function cartSubtotal(){return sum(saleCart,i=>i.qty*i.price)}function cartDiscount(){return sum(saleCart,i=>Math.min(i.qty*i.price,Math.max(0,i.discount||0)*i.qty*i.price/100))}function cartAfterItems(){return Math.max(0,cartSubtotal()-cartDiscount())}function cartTotal(){return Math.max(0,cartAfterItems()-Math.min(cartAfterItems(),Number(document.getElementById('saleDiscount')?.value)||0))}
function sales(){saleCart=[];selectedSaleProductId=null;return `<h2>Registar venda</h2><section class="panel"><div class="page-legend"><span><i style="background:#16845b"></i>Total da venda</span><span><i style="background:#176bba"></i>Valor pago</span><span><i style="background:#d97706"></i>Dívida</span><span><i style="background:#8b5ac2"></i>Descontos</span></div><div class="row"><div><label>Cliente (registado ou novo) *</label><input id="sclientName" placeholder="Escreva o nome do cliente" oninput="searchSaleClients()" autocomplete="off"><div class="actions"><button type="button" class="secondary" onclick="searchSaleClients(true)">Seleccionar cliente registado</button></div><div id="clientSearchResults" class="picker-results hide"></div><small class="muted">Pode escolher um cliente existente ou escrever o nome de um novo cliente.</small></div><div><label>Operador responsável</label><input value="${esc(operatorName())}" disabled></div></div><div class="row"><div><label>Pesquisar produto</label><input id="sproductSearch" placeholder="Escreva o nome ou código" oninput="searchSaleProducts()" autocomplete="off"><div class="actions"><button type="button" class="secondary" onclick="searchSaleProducts(true)">Seleccionar produto</button></div><div id="productSearchResults" class="picker-results hide"></div><small class="muted">Escolha um produto na lista para o adicionar ao carrinho.</small></div><div><label>Quantidade</label><input id="sqty" type="number" min="1" step="1" value="1"></div></div><div class="actions"><button type="button" onclick="addCartItem()">Adicionar produto ao carrinho</button></div><h3 style="margin-top:18px">Carrinho</h3><div id="cartArea">${cartHTML()}</div><div class="row"><div><label>Desconto geral (Kz)</label><input id="saleDiscount" type="number" min="0" value="0" oninput="refreshCart()"></div><div><label>Forma de pagamento</label><select id="payMethod"><option>Dinheiro</option><option>Transferência</option><option>Multicaixa Express</option></select></div><div><label>Valor entregue / pago (Kz)</label><input id="payAmount" type="number" min="0" value="0" oninput="paymentPreview()"></div><div><label>Estado do pagamento</label><select id="payMode" onchange="paymentPreview()"><option value="normal">Pagamento normal</option><option value="partial">Pagamento parcial</option><option value="credit">Venda a crédito</option></select></div></div><div id="paymentInfo" class="metric sales-total" style="margin-top:10px">Total: ${money(0)}</div><div class="actions"><button onclick="finishSale()">Finalizar venda e emitir factura</button><button class="secondary" onclick="clearCart()">Limpar carrinho</button></div><p class="muted">O cliente é obrigatório. Pode ser registado ou identificado pelo nome no momento da venda.</p></section>${salesHistoryHTML()}`}
function searchSaleClients(showAll=false){const box=document.getElementById('clientSearchResults'),field=document.getElementById('sclientName');if(!box||!field)return;const q=field.value.trim().toLowerCase();const found=db.clients.filter(c=>!q||String(c.name||'').toLowerCase().includes(q)||String(c.phone||'').toLowerCase().includes(q)).slice(0,20);box.classList.remove('hide');box.innerHTML=found.length?found.map(c=>`<button type="button" class="picker-option" onclick="selectSaleClient('${c.id}')"><strong>${esc(c.name)}</strong><small>${esc(c.phone||'Sem telefone')}</small></button>`).join(''):'<p class="muted picker-empty">Nenhum cliente registado encontrado. Pode continuar a escrever um nome novo.</p>';if(!showAll&&q.length===0)box.classList.add('hide')}
function selectSaleClient(cid){const c=db.clients.find(x=>x.id===cid);if(!c)return;const field=document.getElementById('sclientName');if(field)field.value=c.name;document.getElementById('clientSearchResults')?.classList.add('hide')}
function searchSaleProducts(showAll=false){const box=document.getElementById('productSearchResults'),field=document.getElementById('sproductSearch');if(!box||!field)return;const q=field.value.trim().toLowerCase();selectedSaleProductId=null;const found=db.products.filter(p=>!q||String(p.name||'').toLowerCase().includes(q)||String(p.code||'').toLowerCase().includes(q)).slice(0,30);box.classList.remove('hide');box.innerHTML=found.length?found.map(p=>`<button type="button" class="picker-option" onclick="chooseSaleProduct('${p.id}')"><strong>${esc(p.name)}</strong><small>Código: ${esc(p.code||'—')} · Stock: ${Number(p.stock)||0} · Preço: ${money(p.price)}</small></button>`).join(''):'<p class="muted picker-empty">Nenhum produto encontrado. Verifique o nome ou código.</p>';if(!showAll&&q.length===0)box.classList.add('hide')}
function chooseSaleProduct(pid){const p=db.products.find(x=>x.id===pid);if(!p)return;selectedSaleProductId=pid;const field=document.getElementById('sproductSearch');if(field)field.value=p.name+' ['+(p.code||'sem código')+']';document.getElementById('productSearchResults')?.classList.add('hide')}

function cartHTML(){if(!saleCart.length)return '<p class="empty">Nenhum produto adicionado.</p>';return `<div class="tablewrap"><table><tr><th>Produto</th><th>Qtd.</th><th>Preço</th><th>Desc. %</th><th>Subtotal</th><th></th></tr>${saleCart.map((i,n)=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td><input style="width:75px;padding:6px" type="number" min="0" max="100" value="${i.discount}" onchange="setItemDiscount(${n},this.value)"></td><td>${money(i.qty*i.price*(1-i.discount/100))}</td><td><button class="smallbtn danger" onclick="removeCartItem(${n})">X</button></td></tr>`).join('')}</table></div><div class="total-line"><span>Subtotal</span><b>${money(cartSubtotal())}</b></div><div class="total-line sales-discount"><span>Descontos por produto</span><b>${money(cartDiscount())}</b></div><div class="total-line sales-total"><span>Total após desconto por produto</span><b>${money(cartAfterItems())}</b></div>`}
function refreshCart(){const a=document.getElementById('cartArea');if(a)a.innerHTML=cartHTML();paymentPreview()}function setItemDiscount(n,v){saleCart[n].discount=Math.max(0,Math.min(100,Number(v)||0));refreshCart()}function addCartItem(){const raw=val('sproductSearch').toLowerCase();let p=selectedSaleProductId?db.products.find(x=>x.id===selectedSaleProductId):null;if(!p){const matches=db.products.filter(x=>raw===String(x.name||'').toLowerCase()||raw===String(x.code||'').toLowerCase());if(matches.length===1)p=matches[0]}const qty=num('sqty');if(!p)return alert('Toque em “Seleccionar produto” e escolha um produto da lista.');if(!Number.isInteger(qty)||qty<=0||qty>Number(p.stock||0))return alert('Quantidade inválida ou stock insuficiente. Stock disponível: '+(Number(p.stock)||0));const old=saleCart.find(i=>i.productId===p.id),already=old?old.qty:0;if(qty+already>Number(p.stock||0))return alert('Stock insuficiente. Disponível: '+(Number(p.stock||0)-already));if(old)old.qty+=qty;else saleCart.push({productId:p.id,name:p.name,qty,price:Number(p.price),cost:Number(p.cost),discount:0});document.getElementById('sqty').value=1;document.getElementById('sproductSearch').value='';selectedSaleProductId=null;document.getElementById('productSearchResults')?.classList.add('hide');refreshCart()}function removeCartItem(n){saleCart.splice(n,1);refreshCart()}function clearCart(){saleCart=[];refreshCart()}
function paymentPreview(){const info=document.getElementById('paymentInfo');if(!info)return;const total=cartTotal(),mode=val('payMode')||'normal',entered=Math.max(0,num('payAmount'));const paid=mode==='credit'?0:mode==='partial'?Math.min(total,entered):entered;const due=Math.max(0,total-Math.min(total,paid)),change=mode==='normal'?Math.max(0,entered-total):0;info.innerHTML=`<div class="total-line sales-total"><span>Total a pagar</span><b>${money(total)}</b></div><div class="total-line sales-paid"><span>Valor considerado pago</span><b>${money(Math.min(total,paid))}</b></div><div class="total-line"><span>Troco</span><b>${money(change)}</b></div><div class="total-line sales-debt"><span>Saldo em dívida</span><b class="${due?'bad':''}">${money(due)}</b></div>`}
async function finishSale(){if(!saleCart.length)return alert('Adicione pelo menos um produto.');for(const i of saleCart){const p=db.products.find(x=>x.id===i.productId);if(!p||p.stock<i.qty)return alert('Stock insuficiente para '+i.name)}const customerName=val('sclientName');if(!customerName)return alert('Informe o nome do cliente. Este campo é obrigatório.');const c=db.clients.find(x=>String(x.name||'').trim().toLowerCase()===customerName.toLowerCase());const subtotal=cartSubtotal(),itemDiscount=cartDiscount(),generalDiscount=Math.min(cartAfterItems(),Math.max(0,num('saleDiscount'))),total=Math.max(0,subtotal-itemDiscount-generalDiscount),mode=val('payMode')||'normal',method=val('payMethod')||'Dinheiro',entered=Math.max(0,num('payAmount'));if(generalDiscount>cartAfterItems())return alert('Desconto geral superior ao valor da venda.');if(mode==='normal'&&entered<total)return alert('O valor pago é inferior ao total. Escolha pagamento parcial ou crédito.');if(mode==='credit'&&entered>0)return alert('Para registar uma entrada numa venda a crédito, escolha pagamento parcial.');const paid=mode==='credit'?0:Math.min(total,entered),due=Math.max(0,total-paid),change=mode==='normal'?Math.max(0,entered-total):0;if(due>0&&!await mgConfirm('Registar saldo em dívida de '+money(due)+'?'))return;const items=saleCart.map(i=>({...i,lineTotal:i.qty*i.price*(1-i.discount/100)}));const s={id:id(),no:'FT-'+String(db.sales.length+1).padStart(5,'0'),date:today(),time:nowTime(),clientId:c?.id||'',clientName:c?.name||customerName,clientNif:c?.nif||'',operatorName:operatorName(),items,subtotal,itemDiscount,generalDiscount,total,paid,due,change,paymentMethod:method,payments:paid>0?[{date:today(),amount:paid,method}]:[]};items.forEach(i=>{const p=db.products.find(x=>x.id===i.productId);p.stock-=i.qty});db.sales.push(s);if(due>0)db.debts.push({id:id(),saleId:s.id,saleNo:s.no,clientName:s.clientName,clientId:s.clientId,original:total,paid,due,date:today(),status:'Aberta'});saleCart=[];save();render();printSale(s.id)}
function debtsPage(){const open=activeSales().filter(s=>Number(s.due)>0);const rows=activeSales().filter(s=>Number(s.due)>0||s.payments?.length).slice().reverse();return `<h2>Controlo de dívidas</h2><div class="page-legend"><span><i style="background:#c47a12"></i>Valores em dívida</span><span><i style="background:#176bba"></i>Clientes e quantidades</span><span><i style="background:#16845b"></i>Pagamentos recebidos</span></div><div class="grid"><div class="metric debt-metric">Total por receber<b class="value-debt">${money(outstanding())}</b></div><div class="metric">Clientes devedores<b class="value-info">${new Set(open.map(s=>s.clientId||s.clientName)).size}</b></div><div class="metric debt-metric">Vendas com saldo<b class="value-debt">${open.length}</b></div></div><section class="panel"><h3>Registar recebimento</h3><label>Venda / cliente</label><select id="debtSale">${open.map(s=>`<option value="${s.id}">${s.no} — ${esc(s.clientName)} — Em falta ${money(s.due)}</option>`).join('')}</select><div class="row"><div><label>Valor recebido (Kz)</label><input id="debtAmount" type="number" min="1" step="0.01" placeholder="Introduza o valor"></div><div><label>Forma de recebimento</label><select id="debtMethod"><option>Dinheiro</option><option>Transferência</option><option>Multicaixa Express</option></select></div></div><div class="actions"><button onclick="receiveDebt()" ${open.length?'':'disabled'}>Registar pagamento</button></div></section><section class="panel"><h3>Clientes devedores e produtos</h3><label>Pesquisar cliente, produto ou número da venda</label><input id="debtFilter" placeholder="Escreva para pesquisar..." oninput="filterDebtRows()"><div class="tablewrap"><table id="debtTable"><thead><tr><th>Venda / Data</th><th>Cliente</th><th>Produto(s)</th><th>Qtd.</th><th>Total</th><th>Já pago</th><th>Por pagar</th><th>Estado</th></tr></thead><tbody>${rows.map(s=>{const names=(s.items||[]).map(i=>esc(i.name)).join('<br>')||'—';const qty=(s.items||[]).map(i=>`<b class="value-quantity">${i.qty}</b>`).join('<br>')||'—';return `<tr data-search="${esc([s.no,s.clientName,...(s.items||[]).map(i=>i.name)].join(' ').toLowerCase())}"><td>${s.no}<br>${s.date}</td><td>${esc(s.clientName)}</td><td>${names}</td><td>${qty}</td><td><b>${money(s.total)}</b></td><td><b class="value-sales">${money(s.paid)}</b></td><td class="${s.due>0?'bad':''}"><b class="value-debt">${money(s.due)}</b></td><td>${s.due>0?'<span class="warning">Pendente</span>':'<span class="pill">Liquidada</span>'}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Não existem dívidas registadas.</td></tr>'}</tbody></table></div></section>`}function filterDebtRows(){const q=(document.getElementById('debtFilter')?.value||'').toLowerCase();document.querySelectorAll('#debtTable tbody tr[data-search]').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none')}
function receiveDebt(){const s=db.sales.find(x=>x.id===val('debtSale')),amount=num('debtAmount');if(!s)return alert('Não há venda em dívida seleccionada.');if(amount<=0||amount>s.due)return alert('Informe um valor válido, até '+money(s.due));const method=val('debtMethod');s.paid=Number(s.paid||0)+amount;s.due=Math.max(0,s.total-s.paid);s.payments=s.payments||[];s.payments.push({date:today(),amount,method});const d=db.debts.find(x=>x.saleId===s.id);if(d){d.paid=s.paid;d.due=s.due;d.status=s.due?'Aberta':'Liquidada'}db.payments.push({id:id(),saleId:s.id,date:today(),amount,method});save();render();alert('Recebimento registado. Saldo em falta: '+money(s.due))}
function returnableQty(s,item){const done=sum((db.returns||[]).filter(r=>r.saleId===s.id),r=>sum((r.items||[]).filter(x=>x.productId===item.productId),x=>Number(x.qty)||0));return Math.max(0,Number(item.qty||0)-done)}
function returnableGross(s,item){const qty=returnableQty(s,item),unit=Number(item.lineTotal??(item.qty*item.price))/Math.max(1,Number(item.qty)||1);return qty*unit}
function returnsPage(){db.returns=Array.isArray(db.returns)?db.returns:[];const eligible=activeSales().filter(s=>(s.items||[]).some(i=>returnableQty(s,i)>0));const totalRefund=sum(db.returns,r=>Number(r.refund)||0);const totalUnits=sum(db.returns,r=>sum(r.items||[],i=>Number(i.qty)||0));const totalGoods=sum(db.returns,r=>Number(r.gross)||0);return `<h2>Devoluções e reembolsos</h2><div class="page-legend"><span><i style="background:#7652a8"></i>Devoluções registadas</span><span><i style="background:#176bba"></i>Unidades devolvidas</span><span><i style="background:#bd3b3b"></i>Valores reembolsados</span></div><div class="grid"><div class="metric return-metric">Devoluções registadas<b class="value-return">${db.returns.length}</b></div><div class="metric refund-metric">Total reembolsado<b class="value-refund">${money(totalRefund)}</b></div><div class="metric">Produtos devolvidos<b class="value-quantity">${totalUnits}</b></div><div class="metric return-metric">Valor total devolvido<b class="value-return">${money(totalGoods)}</b></div></div><section class="panel"><h3>Registar devolução</h3><label>Venda original</label><select id="returnSale" onchange="updateReturnItems()"><option value="">Seleccione uma venda</option>${eligible.map(s=>`<option value="${s.id}">${s.no} — ${esc(s.clientName)} — ${s.date} — ${money(s.total)}</option>`).join('')}</select><div class="row"><div><label>Produto comprado</label><select id="returnProduct" onchange="previewReturn()"><option value="">Seleccione primeiro a venda</option></select></div><div><label>Quantidade a devolver</label><input id="returnQty" type="number" min="1" value="1" oninput="previewReturn()"></div></div><div class="row"><div><label>Motivo da devolução</label><select id="returnReason"><option>Produto com defeito</option><option>Produto errado</option><option>Cliente desistiu da compra</option><option>Produto danificado</option><option>Outro motivo</option></select></div><div><label>Destino do reembolso</label><select id="returnMethod"><option>Dinheiro</option><option>Transferência</option><option>Multicaixa Express</option><option>Crédito na loja</option></select></div></div><label><input id="restockReturn" type="checkbox" checked style="width:auto;margin-right:7px">Produto em condições de voltar ao stock</label><div id="returnPreview" class="metric" style="margin-top:10px">Seleccione uma venda e um produto para calcular os valores.</div><div class="actions"><button onclick="recordReturn(false)" ${eligible.length?'':'disabled'}>Registar devolução parcial</button><button class="danger" onclick="recordReturn(true)" ${eligible.length?'':'disabled'}>Devolver toda a compra</button></div><p class="muted">O reembolso em dinheiro nunca ultrapassa o valor efectivamente pago. A parte ainda não paga é abatida à dívida. Cada unidade só pode ser devolvida uma vez.</p></section><section class="panel"><h3>Histórico de devoluções</h3><div class="tablewrap"><table><tr><th>Data</th><th>Venda</th><th>Cliente</th><th>Produto(s)</th><th>Qtd.</th><th>Valor devolvido</th><th>Reembolso</th><th>Destino</th><th></th></tr>${db.returns.slice().reverse().map(r=>`<tr><td>${r.date}</td><td>${esc(r.saleNo)}</td><td>${esc(r.clientName)}</td><td>${(r.items||[]).map(i=>esc(i.name)).join('<br>')}</td><td>${(r.items||[]).map(i=>`<b class="value-quantity">${i.qty}</b>`).join('<br>')}</td><td><b class="value-return">${money(r.gross)}</b></td><td><b class="value-refund">${money(r.refund)}</b></td><td>${esc(r.method)}</td><td><button class="smallbtn secondary" onclick="printReturn('${r.id}')">Comprovativo</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">Ainda não existem devoluções.</td></tr>'}</table></div></section>`}
function updateReturnItems(){const s=db.sales.find(x=>x.id===val('returnSale')),sel=document.getElementById('returnProduct');if(!sel)return;sel.innerHTML=s?'<option value="">Seleccione o produto</option>'+(s.items||[]).filter(i=>returnableQty(s,i)>0).map((i,n)=>`<option value="${i.productId||n}">${esc(i.name)} — disponível para devolução: ${returnableQty(s,i)}</option>`).join(''):'<option value="">Seleccione primeiro a venda</option>';previewReturn()}
function selectedReturnItem(s){const key=val('returnProduct');return (s?.items||[]).find((i,n)=>(i.productId||String(n))===key)}
function calculateReturn(s,item,qty){if(!s||!item||qty<=0)return {gross:0,refund:0,debtReduction:0};const unit=Number(item.lineTotal??(item.qty*item.price))/Math.max(1,Number(item.qty)||1),gross=unit*qty,ratio=Number(s.total)>0?Math.min(1,Math.max(0,Number(s.paid||0)/Number(s.total))):0,refund=Math.min(Number(s.paid||0),gross*ratio);return {gross,refund,debtReduction:Math.max(0,gross-refund)}}
function previewReturn(){const out=document.getElementById('returnPreview');if(!out)return;const s=db.sales.find(x=>x.id===val('returnSale')),item=selectedReturnItem(s),qty=num('returnQty'),max=item&&s?returnableQty(s,item):0;if(!item){out.textContent='Seleccione uma venda e um produto.';return}const c=calculateReturn(s,item,Math.min(qty,max));out.innerHTML=`<div class="total-line"><span>Quantidade máxima disponível</span><b>${max}</b></div><div class="total-line"><span>Valor da mercadoria devolvida</span><b>${money(c.gross)}</b></div><div class="total-line"><span>Valor a reembolsar</span><b>${money(c.refund)}</b></div><div class="total-line"><span>Redução da dívida</span><b>${money(c.debtReduction)}</b></div>`}
async function recordReturn(all){const s=db.sales.find(x=>x.id===val('returnSale'));if(!s)return alert('Seleccione a venda original.');let chosen=[];if(all){chosen=(s.items||[]).map(i=>({item:i,qty:returnableQty(s,i)})).filter(x=>x.qty>0)}else{const item=selectedReturnItem(s),qty=num('returnQty');if(!item)return alert('Seleccione o produto.');const max=returnableQty(s,item);if(qty<=0||qty>max)return alert('Quantidade inválida. Máximo disponível: '+max);chosen=[{item,qty}]};if(!chosen.length)return alert('Esta venda já não tem produtos disponíveis para devolução.');const gross=chosen.reduce((n,x)=>n+calculateReturn(s,x.item,x.qty).gross,0),refund=chosen.reduce((n,x)=>n+calculateReturn(s,x.item,x.qty).refund,0),debtReduction=Math.max(0,gross-refund);const reason=all?'Devolução total da compra':val('returnReason');if(!await mgConfirm('Confirmar devolução de '+money(gross)+'? Reembolso: '+money(refund)+'.'))return;const items=chosen.map(x=>({productId:x.item.productId,name:x.item.name,qty:x.qty,unitPrice:Number(x.item.lineTotal??x.item.qty*x.item.price)/Math.max(1,Number(x.item.qty)||1),gross:calculateReturn(s,x.item,x.qty).gross}));chosen.forEach(x=>{const item=x.item,oldQty=Number(item.qty)||0,unit=Number(item.lineTotal??oldQty*item.price)/Math.max(1,oldQty);item.qty=oldQty-x.qty;item.lineTotal=Math.max(0,unit*item.qty);if(document.getElementById('restockReturn')?.checked){const p=db.products.find(p=>p.id===item.productId);if(p)p.stock=Number(p.stock||0)+x.qty}});s.total=Math.max(0,Number(s.total||0)-gross);s.paid=Math.max(0,Number(s.paid||0)-refund);s.due=Math.max(0,Number(s.due||0)-debtReduction);s.items=s.items.filter(i=>Number(i.qty)>0);s.returnedGross=Number(s.returnedGross||0)+gross;const r={id:id(),date:today(),saleId:s.id,saleNo:s.no,clientName:s.clientName,items,gross,refund,debtReduction,method:val('returnMethod'),reason,restocked:!!document.getElementById('restockReturn')?.checked};db.returns=db.returns||[];db.returns.push(r);const d=db.debts.find(x=>x.saleId===s.id);if(d){d.original=s.total;d.paid=s.paid;d.due=s.due;d.status=s.due?'Aberta':'Liquidada'}save();render();alert('Devolução registada. Reembolso: '+money(refund)+'; dívida reduzida: '+money(debtReduction)+'.')}
function printReturn(rid){const r=(db.returns||[]).find(x=>x.id===rid);if(!r)return;const a=document.getElementById('receiptArea');a.classList.remove('hide');a.innerHTML=`<div class="receipt"><h2>${esc(db.settings.name)}</h2><p class="center">${esc(db.settings.address)}<br>NIF: ${esc(db.settings.nif)}</p><hr><h3 class="center">COMPROVATIVO DE DEVOLUÇÃO</h3><p>N.º venda: ${esc(r.saleNo)}<br>Data: ${r.date}<br>Cliente: ${esc(r.clientName)}<br>Motivo: ${esc(r.reason)}</p><table><tr><th>Produto</th><th>Qtd.</th><th>Valor</th></tr>${r.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.gross)}</td></tr>`).join('')}</table><p>Valor da mercadoria: ${money(r.gross)}<br>Redução da dívida: ${money(r.debtReduction)}<br>Forma: ${esc(r.method)}</p><h3 style="text-align:right">REEMBOLSO: ${money(r.refund)}</h3><p class="center">${r.restocked?'Produtos reintegrados no stock.':'Produtos não reintegrados no stock.'}</p><div class="actions no-print"><button onclick="window.print()">Imprimir / Guardar PDF</button><button class="secondary" onclick="closeSaleInvoice()">Fechar</button></div></div>`;window.scrollTo(0,0)}

function financialDiagnosis(){const period=val('riskPeriod')||'month',now=new Date();let from='0000-00-00';if(period==='today')from=today();if(period==='7'){const d=new Date();d.setDate(d.getDate()-6);from=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}if(period==='month')from=today().slice(0,7)+'-01';if(period==='year')from=today().slice(0,4)+'-01-01';const salesIn=activeSales().filter(x=>period==='all'||String(x.date||'')>=from),expensesIn=db.expenses.filter(x=>period==='all'||String(x.date||'')>=from);const rev=sum(salesIn,x=>Number(x.total)||0),cogs=sum(salesIn,x=>sum(x.items||[],i=>(Number(i.qty)||0)*(Number(i.cost)||0))),exp=sum(expensesIn,x=>Number(x.amount)||0),profit=rev-cogs-exp,received=sum(activeSales(),x=>{const ps=Array.isArray(x.payments)?x.payments:[];if(ps.length)return sum(ps,p=>(period==='all'||String(p.date||x.date||'')>=from)?(Number(p.amount)||0):0);return (period==='all'||String(x.date||'')>=from)?(Number(x.paid)||0):0}),due=outstanding(),stockCost=sum(db.products,p=>(Number(p.stock)||0)*(Number(p.cost)||0)),stockSale=sum(db.products,p=>(Number(p.stock)||0)*(Number(p.price)||0)),cash=received-exp,margin=rev>0?(profit/rev)*100:0;let score=0,reasons=[];if(!activeSales().length&&!db.expenses.length&&!db.products.length){return `<h2>Diagnóstico financeiro e risco de falência</h2><section class="panel risk-unknown"><h3>Dados insuficientes</h3><p>Registe vendas, despesas e produtos para o sistema avaliar a situação financeira.</p></section>`}if(profit<0){score+=30;reasons.push('O resultado estimado do período está negativo.')}else if(rev>0&&margin<10){score+=15;reasons.push('A margem estimada de lucro é inferior a 10%.')}if(cash<0){score+=25;reasons.push('Os recebimentos registados não cobrem as despesas do período.')}if(rev>0&&due>rev*.5){score+=15;reasons.push('As dívidas por receber são superiores a metade da receita do período.')}if(rev>0&&exp>Math.max(0,rev-cogs)){score+=15;reasons.push('As despesas superam o lucro bruto estimado.')}if(rev===0&&stockCost>0){score+=15;reasons.push('Existe stock investido, mas não há vendas no período seleccionado.')}if(stockCost>0&&stockSale===0){score+=5;reasons.push('O stock registado não tem valor potencial de venda; verifique os preços.')}score=Math.min(100,score);const level=score>=50?'Risco elevado':score>=25?'Atenção — risco moderado':'Situação estável';const cls=score>=50?'risk-high':score>=25?'risk-medium':'risk-good';const advice=reasons.length?reasons:['Os indicadores actuais não revelam sinais fortes de risco financeiro. Continue a acompanhar a margem, as despesas e a cobrança das dívidas.'];return `<h2>Diagnóstico financeiro e risco de falência</h2><section class="panel"><div class="row"><div><label>Período de análise</label><select id="riskPeriod" onchange="render()"><option value="today" ${period==='today'?'selected':''}>Hoje</option><option value="7" ${period==='7'?'selected':''}>Últimos 7 dias</option><option value="month" ${period==='month'?'selected':''}>Este mês</option><option value="year" ${period==='year'?'selected':''}>Este ano</option><option value="all" ${period==='all'?'selected':''}>Todo o histórico</option></select></div><div><label>Índice de risco estimado</label><div class="metric ${cls}"><b>${score}/100 — ${level}</b></div></div></div><p class="muted">Avaliação automática indicativa, não é uma declaração legal de falência nem substitui análise contabilística.</p></section><div class="grid"><div class="metric report-sales">Receita das vendas<b class="value-sales">${money(rev)}</b></div><div class="metric report-profit">Lucro / prejuízo estimado<b class="${profit>=0?'value-info':'bad'}">${money(profit)}</b></div><div class="metric report-cost">Custo dos produtos vendidos<b class="value-expense">${money(cogs)}</b></div><div class="metric report-cost">Despesas registadas<b class="value-expense">${money(exp)}</b></div><div class="metric report-debt">Dívidas por receber<b class="value-debt">${money(due)}</b></div><div class="metric report-received">Recebimentos registados<b class="value-sales">${money(received)}</b></div><div class="metric report-cost">Valor do stock ao preço de compra<b>${money(stockCost)}</b></div><div class="metric report-sales">Valor potencial de venda do stock<b>${money(stockSale)}</b></div><div class="metric ${cash>=0?'sales-paid':'sales-debt'}">Saldo estimado (recebido − despesas)<b class="${cash>=0?'value-sales':'bad'}">${money(cash)}</b></div><div class="metric">Margem líquida estimada<b>${margin.toFixed(1)}%</b></div></div><section class="panel ${cls}"><h3>Resultado do diagnóstico: ${level}</h3><p>Índice indicativo: <b>${score}/100</b>. Quanto maior a pontuação, maior a necessidade de atenção.</p><h3>Factores considerados</h3><ul>${advice.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="panel"><h3>Como interpretar</h3><p><b>Estável (0–24):</b> sem sinais fortes de risco nos dados registados.</p><p><b>Moderado (25–49):</b> requer controlo de custos, margens e cobranças.</p><p><b>Elevado (50–100):</b> requer intervenção rápida e revisão do fluxo de caixa.</p><p class="muted">O stock é mostrado ao custo e ao preço de venda, mas não é tratado como dinheiro disponível. As dívidas por receber também não são consideradas dinheiro em caixa.</p></section>`}

function settings(){const shown=db.settings.showMetrics||['Vendas realizadas','Lucro estimado','Despesas registadas','Dívidas por receber','Produtos cadastrados','Clientes','Vendas registadas','Stock total'];const metrics=['Vendas realizadas','Lucro estimado','Despesas registadas','Dívidas por receber','Produtos cadastrados','Clientes','Vendas registadas','Stock total'];return `<h2>Configurações do sistema</h2><section class="panel"><h3>🎨 Aparência e personalização</h3><div class="row"><div><label>Tema do sistema</label><select id="themeChoice" onchange="setTheme(this.value)"><option value="azul" ${(db.settings.theme||'azul')==='azul'?'selected':''}>Azul profissional</option><option value="verde" ${db.settings.theme==='verde'?'selected':''}>Verde empresarial</option><option value="roxo" ${db.settings.theme==='roxo'?'selected':''}>Roxo moderno</option><option value="escuro" ${db.settings.theme==='escuro'?'selected':''}>Modo escuro</option></select></div><div><label>Tamanho do texto</label><select id="fontChoice" onchange="setFontSize(this.value)"><option value="14" ${String(db.settings.fontSize||15)==='14'?'selected':''}>Pequeno</option><option value="15" ${String(db.settings.fontSize||15)==='15'?'selected':''}>Normal</option><option value="17" ${String(db.settings.fontSize||15)==='17'?'selected':''}>Grande</option><option value="18" ${String(db.settings.fontSize||15)==='18'?'selected':''}>Muito grande</option></select></div></div><label>Cor de destaque</label><div class="color-row">${[['#1676c5','Azul'],['#16845b','Verde'],['#8b5ac2','Roxo'],['#d97706','Laranja'],['#c13e62','Rosa'],['#202b3b','Grafite']].map(([c,n])=>`<button class="color-dot ${db.settings.accent===c?'selected':''}" style="background:${c}" title="${n}" onclick="setAccent('${c}')"></button>`).join('')}</div><p class="muted">A alteração é aplicada imediatamente e guardada neste dispositivo.</p></section><section class="panel chart-settings"><h3>📈 Editar gráficos dinâmicos</h3><p class="muted">Personalize separadamente o formato e os indicadores apresentados em cada gráfico. As escolhas ficam guardadas neste dispositivo.</p><h3>Gráfico 1 — Vendas</h3><label class="setting-tile"><input type="checkbox" style="width:auto;margin-right:8px" ${db.settings.salesChartVisible!==false?'checked':''} onchange="setChartVisibility('sales',this.checked)">Mostrar gráfico de vendas</label><label>Formato do gráfico de vendas</label><select onchange="setIndividualChartType('sales',this.value)">${chartTypeOptions(db.settings.salesChartType||db.settings.chartType||'bar')}</select><hr><h3>Gráfico 2 — Indicadores financeiros</h3><p class="muted">As vendas/receitas não aparecem aqui porque já estão no Gráfico 1. Seleccione os indicadores que pretende comparar.</p><label>Formato dos indicadores</label><select onchange="setIndividualChartType('finance',this.value)">${chartTypeOptions(db.settings.financeChartType||db.settings.chartType||'bar')}</select><div class="settings-grid">${[['profit','Lucro'],['debt','Dívida'],['expenses','Despesas'],['cogs','Custo da mercadoria'],['received','Dinheiro recebido']].map(([k,n])=>`<label class="setting-tile"><input type="checkbox" style="width:auto;margin-right:8px" ${(db.settings.financeChartSeries||['profit','debt','expenses','cogs','received']).includes(k)?'checked':''} onchange="toggleFinanceSeries('${k}',this.checked)"><strong>${n}</strong></label>`).join('')}</div><p class="muted">As percentagens dos indicadores financeiros continuam calculadas em relação ao total de vendas do período, mesmo sem mostrar receitas no Gráfico 2.</p></section><section class="panel"><h3>📊 Painel principal</h3><p class="muted">Escolha os indicadores que pretende visualizar no início.</p><div class="settings-grid">${metrics.map(m=>`<label class="setting-tile"><input type="checkbox" style="width:auto;margin-right:8px" ${shown.includes(m)?'checked':''} onchange="toggleMetric('${m}',this.checked)"><strong>${m}</strong></label>`).join('')}</div></section><section class="panel"><h3>🏢 Dados da empresa e documentos</h3><div class="row"><div><label>Nome da empresa</label><input id="setname" value="${esc(db.settings.name)}"></div><div><label>NIF</label><input id="setnif" value="${esc(db.settings.nif)}"></div><div><label>Endereço</label><input id="setaddress" value="${esc(db.settings.address)}"></div><div><label>Moeda</label><input id="setcurrency" value="${esc(db.settings.currency)}"></div></div><div class="actions"><button onclick="saveSettings()">Guardar dados da empresa</button></div><p class="muted">O nome do sistema é independente do nome comercial da sua empresa.</p></section><section class="panel"><h3>👤 Operador e utilizadores</h3><label>Nome do operador padrão</label><input id="operatorNameInput" value="${esc(db.settings.operatorName||'Operador')}" placeholder="Nome do operador"><div class="actions"><button onclick="saveOperatorName()">Guardar operador</button></div><hr><h3>Criar utilizador para entrar no sistema</h3><div class="row"><div><label>Nome completo</label><input id="newUserName" placeholder="Nome do utilizador"></div><div><label>Nome de utilizador</label><input id="newUsername" autocomplete="off" placeholder="Ex.: operador1"></div><div><label>Palavra-passe</label><input id="newUserPassword" type="password" placeholder="Crie uma palavra-passe"></div></div><div class="actions"><button onclick="addSystemUser()">Criar utilizador</button></div><p class="muted">As contas são guardadas localmente neste dispositivo. Para maior segurança, use uma palavra-passe exclusiva e mantenha cópias de segurança protegidas.</p><h3>Utilizadores existentes</h3><div class="tablewrap"><table><tr><th>Nome</th><th>Utilizador</th><th>Conta</th><th></th></tr>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>Activa</td><td><button class="smallbtn danger" onclick="deleteSystemUser('${u.id}')">Remover</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Ainda não foram criados utilizadores.</td></tr>'}</table></div></section><section class="panel"><h3>🔐 Segurança e acesso</h3><p class="muted">Escolha como pretende proteger o Meu Gestor. A opção Nenhum abre directamente o sistema, sem ecrã de login.</p><label>Modo de acesso</label><select id="accessModeChoice" onchange="setAccessMode(this.value)"><option value="none" ${(db.settings.accessMode||'none')==='none'?'selected':''}>Nenhum — sem login</option><option value="pin" ${db.settings.accessMode==='pin'?'selected':''}>PIN — código numérico</option><option value="user" ${db.settings.accessMode==='user'?'selected':''}>Utilizador — nome e palavra-passe</option></select><p class="muted">Para utilizar Utilizador, crie primeiro uma conta na secção Operador e utilizadores.</p><label>Bloqueio automático por inactividade</label><select id="autoLockChoice" onchange="setAutoLock(this.value)"><option value="0" ${Number(db.settings.autoLock||0)===0?'selected':''}>Desactivado</option><option value="1" ${Number(db.settings.autoLock)===1?'selected':''}>Após 1 minuto</option><option value="5" ${Number(db.settings.autoLock)===5?'selected':''}>Após 5 minutos</option><option value="10" ${Number(db.settings.autoLock)===10?'selected':''}>Após 10 minutos</option><option value="15" ${Number(db.settings.autoLock)===15?'selected':''}>Após 15 minutos</option></select>${db.settings.accessMode==='pin'?`<hr><h3>Alterar PIN de segurança</h3><label>PIN actual</label><input id="oldpin" type="password" inputmode="numeric"><label>Novo PIN (4 a 12 dígitos)</label><input id="newpin" type="password" inputmode="numeric"><label>Confirmar novo PIN</label><input id="confirmpin" type="password" inputmode="numeric"><div class="actions"><button onclick="changePin()">Actualizar PIN</button><button class="secondary" onclick="lockApp()">Bloquear agora</button></div>`:db.settings.accessMode==='user'?`<div class="actions"><button class="secondary" onclick="lockApp()">Bloquear agora</button></div>`:`<p class="muted">Sem autenticação activa. O sistema abre directamente.</p>`}</section><section class="panel"><h3>🛟 Código de recuperação</h3><p class="muted">Altere o código temporário depois de recuperar o acesso. Não o partilhe. Se o esquecer, não será possível recuperar a palavra-passe sem uma cópia de segurança ou acesso aos dados locais.</p><label>Código actual</label><input id="oldRecoveryCode" type="password" placeholder="Código actual"><label>Novo código (mínimo 8 caracteres)</label><input id="newRecoveryCode" type="password" placeholder="Novo código"><label>Confirmar novo código</label><input id="confirmRecoveryCode" type="password" placeholder="Repita o novo código"><div class="actions"><button onclick="changeRecoveryCode()">Actualizar código de recuperação</button></div></section><section class="panel"><h3>💾 Cópias de segurança e manutenção</h3><p class="muted">Faça cópias regularmente. Restaurar uma cópia substitui os dados actuais.</p><input type="file" id="restorefile" accept="application/json"><div class="actions"><button class="secondary" onclick="backup()">Exportar cópia</button><button class="secondary" onclick="restore()">Restaurar cópia</button><button class="danger" onclick="resetApp()">Repor sistema</button></div></section><section class="panel"><h3>ℹ️ Sobre o sistema</h3><div class="grid"><div class="metric">Aplicação<b>Meu Gestor</b></div><div class="metric">Versão<b>8.2.2</b></div><div class="metric">Modo de funcionamento<b>Offline</b></div><div class="metric">Armazenamento<b>Neste dispositivo</b></div></div><p class="muted">Os dados permanecem no dispositivo e no navegador utilizado. Limpar os dados do navegador pode apagá-los; mantenha uma cópia de segurança.</p></section>`}
function setAccessMode(mode){if(!['none','pin','user'].includes(mode))mode='none';if(mode==='user'&&!db.users.length){alert('Crie primeiro pelo menos um utilizador na secção Operador e utilizadores.');const el=document.getElementById('accessModeChoice');if(el)el.value=db.settings.accessMode||'none';return}if(mode==='pin'&&!/^\d{4,12}$/.test(String(db.settings.pin||''))){alert('Defina um PIN válido com 4 a 12 dígitos.');return}db.settings.accessMode=mode;currentUser=null;save();render();alert(mode==='none'?'Acesso sem login activado.':'Protecção de acesso activada.');if(mode!=='none')showSecurityGate()}
function saveOperatorName(){db.settings.operatorName=val('operatorNameInput')||'Operador';save();render();alert('Nome do operador guardado.')}function addSystemUser(){const name=val('newUserName'),username=val('newUsername'),password=document.getElementById('newUserPassword')?.value||'',role=val('newUserRole')||'Operador';if(!name||!username||password.length<4)return alert('Informe o nome, utilizador e palavra-passe com pelo menos 4 caracteres.');if(db.users.some(u=>String(u.username).toLowerCase()===username.toLowerCase()))return alert('Este nome de utilizador já existe.');db.users.push({id:id(),name,username,password,role});save();render();alert('Utilizador criado. Já pode entrar com o nome de utilizador e palavra-passe.')}async function deleteSystemUser(uid){if(!await mgConfirm('Remover este utilizador?'))return;db.users=db.users.filter(u=>u.id!==uid);save();render()}

function setAccent(c){db.settings.accent=c;save();render()}
function setFontSize(n){db.settings.fontSize=Number(n);save();render()}
function setChartType(t){if(!['bar','bar3d','line','area','doughnut','pie'].includes(t))t='bar';db.settings.chartType=t;save();if(page==='Relatórios'){render()}else{render()}}
function setAutoLock(n){db.settings.autoLock=Number(n);save();resetIdleTimer()}
function toggleMetric(name,on){db.settings.showMetrics=db.settings.showMetrics||['Vendas realizadas','Lucro estimado','Despesas registadas','Dívidas por receber','Produtos cadastrados','Clientes','Vendas registadas','Stock total'];db.settings.showMetrics=on?[...new Set([...db.settings.showMetrics,name])]:db.settings.showMetrics.filter(x=>x!==name);save()}
function saveSettings(){db.settings.name=val('setname')||'Minha Empresa';db.settings.nif=val('setnif');db.settings.address=val('setaddress');db.settings.currency=val('setcurrency')||'Kz';save();render()}
let idleTimer=null;function resetIdleTimer(){clearTimeout(idleTimer);const mins=Number(db.settings.autoLock||0);if((db.settings.accessMode||'none')!=='none'&&mins>0&&!document.getElementById('app').classList.contains('hide'))idleTimer=setTimeout(()=>lockApp(),mins*60000)}['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>{if(!document.getElementById('app').classList.contains('hide'))resetIdleTimer()},{passive:true}));
function changePin(){const old=val('oldpin'),p=val('newpin'),confirmPin=val('confirmpin');if(old!==db.settings.pin)return alert('O PIN actual está incorrecto.');if(!/^\d{4,12}$/.test(p))return alert('O novo PIN deve ter entre 4 e 12 dígitos.');if(p!==confirmPin)return alert('A confirmação não corresponde.');db.settings.pin=p;save();alert('PIN alterado com sucesso.');render()}
async function adjustStock(pid){const p=db.products.find(x=>x.id===pid);if(!p)return;const q=await mgPrompt('Quantidade a adicionar (negativo para retirar):','0');if(q===null)return;const n=Number(q);if(!Number.isFinite(n)||p.stock+n<0)return alert('Quantidade inválida.');p.stock+=n;db.stockMoves.push({date:today(),product:p.name,qty:n});save();render()}async function del(type,pid){if(!await mgConfirm('Tem certeza que deseja apagar este registo?'))return;db[type]=db[type].filter(x=>x.id!==pid);save();render()}
async function cancelSale(sid){const s=db.sales.find(x=>x.id===sid);if(!s||s.status==='anulada')return alert('Esta venda já está anulada ou não foi encontrada.');if((db.returns||[]).some(r=>r.saleId===sid))return alert('Esta venda tem devoluções registadas. Não pode ser anulada automaticamente; verifique primeiro as devoluções.');const received=Number(s.paid)||0;const question=`Anular a venda ${s.no}?\n\nO stock será reposto e a dívida removida. A venda continuará visível no histórico como ANULADA.${received>0?`\n\nAtenção: foram recebidos ${money(received)}. A anulação não devolve dinheiro automaticamente; terá de acertar a devolução ao cliente.`:''}`;if(!await mgConfirm(question))return;const reason=await mgPrompt('Motivo da anulação (opcional):','');if(reason===null)return;(s.items||[]).forEach(i=>{const p=db.products.find(x=>x.id===i.productId);if(p)p.stock=(Number(p.stock)||0)+(Number(i.qty)||0)});s.status='anulada';s.cancelledDate=today();s.cancelledTime=nowTime();s.cancelReason=String(reason||'Não indicado').trim()||'Não indicado';s.cancelledPaid=received;s.cancelledDue=Number(s.due)||0;s.paid=0;s.due=0;s.change=0;db.debts=(db.debts||[]).filter(d=>d.saleId!==sid);db.payments=(db.payments||[]).filter(p=>p.saleId!==sid);save();render();alert('Venda e factura anuladas. O stock foi reposto e o registo foi mantido no histórico. Se houve pagamento, faça a devolução ao cliente separadamente.')}
function printSale(sid){const s=db.sales.find(x=>x.id===sid);if(!s)return;const area=document.getElementById('receiptArea');area.classList.remove('hide');area.style.cssText='position:fixed;inset:0;z-index:9999;background:#fff;overflow:auto;padding:16px';document.body.classList.add('invoice-preview');area.innerHTML=`<div class="receipt"><h2>${esc(db.settings.name)}</h2><p class="center">${esc(db.settings.address)}<br>NIF: ${esc(db.settings.nif)}</p><hr><h3 class="center">FACTURA / RECIBO</h3>${s.status==='anulada'?'<h2 style="color:#bd3b3b;text-align:center;border:3px solid #bd3b3b;padding:10px">DOCUMENTO ANULADO</h2>':''}<p>N.º: ${s.no}<br>Data: ${s.date}<br>Hora: ${esc(s.time||'Não registada')}<br>Estado: ${s.status==='anulada'?'ANULADA':'VÁLIDA'}<br>Cliente: ${esc(s.clientName)}<br>Operador: ${esc(s.operatorName||db.settings.operatorName||'Operador')}<br>${s.clientNif?'NIF: '+esc(s.clientNif):''}</p><table><tr><th>Descrição</th><th>Qtd.</th><th>Preço</th><th>Desc. %</th><th>Total</th></tr>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${i.discount||0}%</td><td>${money(i.lineTotal??i.qty*i.price)}</td></tr>`).join('')}</table><p>Subtotal: ${money(s.subtotal)}<br>Desconto nos produtos: ${money(s.itemDiscount)}<br>Desconto geral: ${money(s.generalDiscount)}</p><h3 style="text-align:right">TOTAL: ${money(s.total)}</h3><p>Forma de pagamento: ${esc(s.paymentMethod)}<br>Pago: ${money(s.paid)}<br>Troco: ${money(s.change)}<br>Saldo em dívida: ${money(s.due)}</p>${(s.payments||[]).length?'<h3>Histórico de pagamentos</h3>'+s.payments.map(p=>`<p>${p.date} — ${esc(p.method)} — ${money(p.amount)}</p>`).join(''):''}${s.status==='anulada'?`<p style="color:#bd3b3b;font-weight:bold">ANULADA em ${esc(s.cancelledDate||'')} às ${esc(s.cancelledTime||'')}. Motivo: ${esc(s.cancelReason||'Não indicado')}. Valor recebido na venda: ${money(s.cancelledPaid||0)} — verificar devolução ao cliente.</p>`:''}<p class="center">Documento para controlo comercial interno.<br>${s.status==='anulada'?'Documento sem validade comercial.':'Obrigado pela preferência!'}</p><div class="actions no-print"><button onclick="window.print()">Imprimir / Guardar PDF</button><button class="secondary" onclick="closeSaleInvoice()">Fechar</button></div></div>`;area.scrollTop=0;window.scrollTo(0,0)}
function closeSaleInvoice(){const a=document.getElementById('receiptArea');a.classList.add('hide');a.style.cssText='';document.body.classList.remove('invoice-preview');const h=document.getElementById('salesHistory');if(h)h.scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo(0,0)}
function exportCSV(){const rows=[['Numero','Data','Cliente','Subtotal','Descontos','Total','Pago','Divida','Forma pagamento'],...db.sales.map(s=>[s.no,s.date,s.clientName,s.subtotal,s.itemDiscount+s.generalDiscount,s.total,s.paid,s.due,s.paymentMethod])];download('vendas_v6.csv','text/csv;charset=utf-8',rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n'))}function backup(){download('minha-empresa-backup-v6.json','application/json',JSON.stringify(db,null,2))}function restore(){const f=document.getElementById('restorefile').files[0];if(!f)return alert('Escolha um ficheiro JSON.');const r=new FileReader();r.onload=()=>{try{db=normalize(JSON.parse(r.result));save();render();alert('Cópia restaurada.')}catch(e){alert('Ficheiro inválido.')}};r.readAsText(f)}async function resetApp(){if(!await mgConfirm('Apagar todos os dados? Esta acção não pode ser desfeita.'))return;db=normalize(initial);save();render()}function download(name,type,data){if(window.Android&&typeof window.Android.saveTextFile==='function'){window.Android.saveTextFile(name,type,String(data));return}const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
window.alert=mgAlert;render();if((db.settings.accessMode||'none')!=='none')showSecurityGate();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
